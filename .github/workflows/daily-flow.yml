YAML

name: Daily-Pipeline

'on':
  schedule:
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install openpyxl requests

      - name: Run HSI Daily Ingest
        run: |
          python3 hsioptions/daily_update.py || true

      - name: Run Stock Daily Ingest
        run: |
          if [ -f "stockoptions/stock_daily_update.py" ]; then
            python3 stockoptions/stock_daily_update.py || true
          fi

      - name: Build Combined Dashboard
        run: |
          if [ -f "stockoptions/build_combined.py" ]; then
            python3 stockoptions/build_combined.py || true
          fi

      - name: Prepare Dist
        run: |
          mkdir -p dist
          find your_files/ -name "*.html" -exec cp {} dist/ \; 2>/dev/null || true
          find hsioptions/ -name "*.html" -exec cp {} dist/ \; 2>/dev/null || true
          if [ -f "dist/期權倉數儀表板.html" ]; then
            cp "dist/期權倉數儀表板.html" dist/index.html
          elif [ -f "dist/options-dashboard.html" ]; then
            cp "dist/options-dashboard.html" dist/index.html
          elif [ -f "dist/恆指期權倉數儀表板.html" ]; then
            cp "dist/恆指期權倉數儀表板.html" dist/index.html
          else
            echo "<h1>HSI Options Radar</h1>" > dist/index.html
          fi

      - name: Commit DB Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hsioptions/*.db stockoptions/*.db 2>/dev/null || true
          git commit -m "Auto update DB" || true
          git push origin main || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
